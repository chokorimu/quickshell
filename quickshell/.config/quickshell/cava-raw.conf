# cava-raw.conf — a second, headless cava instance feeding the shell.
#
# The terminal cava (cava/.config/cava/config) draws in a terminal.
# This one runs in raw mode and streams bar heights to stdout, where
# Services/Cava.qml parses them into the media card's background bars.
# cava takes only `-p <config>` on the command line — there is no flag
# for any of this — so it has to be a separate file rather than an
# argument, and it lives here so stow deploys it alongside the shell.
#
# Verified output format: "v0;v1;...;vN\n" — semicolon-separated
# values, newline-framed, each 0..1000. The scale is fixed in ascii
# mode; bit_format is ignored there. 32 bars, mono.

[general]
framerate = 60
bars = 32

[input]
method = pipewire

[output]
method = raw
channels = mono
raw_target = /dev/stdout
data_format = ascii
bit_format = 16bit
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
# the raw visualization is very noisy; 55 keeps the bars smooth
# without turning them into syrup
noise_reduction = 55
